name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 pubspec.yaml 解析出版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "应用版本：$VERSION"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::仓库 Secret KEYSTORE_BASE64 未配置，请先添加签名相关的 4 个 Secret。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --ignore-garbage -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::keystore 无法打开：KEYSTORE_BASE64 需为 .jks/.keystore 文件的 Base64（用 base64 -w0 release.jks 生成），且 STORE_PASSWORD 必须正确。"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 中不存在别名 $KEY_ALIAS，请检查 Secret KEY_ALIAS。"
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=MTFORUM_UPDATE_URL=https://loveqin.fun/Mt/update.json

      - name: Package APK
        run: |
          APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/MTForum-${{ steps.version.outputs.version }}-arm64.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtforum-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MTForum v${{ steps.version.outputs.version }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
